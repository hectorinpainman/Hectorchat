<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hector Chat</title>
<style>
:root{--bg:#1b1f2b;--panel:#232838;--line:#32384c;--text:#e6e8ef;--dim:#8d93a8;--accent:#f0a35e;--accent-ink:#2a1a08;--err:#ff8585}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate form{width:100%;max-width:340px;display:grid;gap:12px}
.gate h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.gate p{margin:0 0 8px;color:var(--dim)}
input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
button.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--err);min-height:1.4em;margin:0}
#app{display:none;height:100%;grid-template-columns:220px 1fr}
#app.on{display:grid}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px}
aside .srv{font-weight:700;font-size:17px;margin-bottom:10px}
aside .ch{background:#2d3449;border-radius:6px;padding:6px 10px}
aside .me{margin-top:auto;color:var(--dim);font-size:13px}
aside .me button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
main{display:flex;flex-direction:column;min-width:0;height:100%;position:relative}
header{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
#log{flex:1;overflow-y:auto;padding:14px 18px}
.msg{padding:2px 0}
.msg .meta{display:flex;gap:8px;align-items:baseline;margin-top:12px}
.msg .who{font-weight:600}
.msg .when{color:var(--dim);font-size:12px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--dim);text-align:center;margin-top:40px}
#send{display:flex;gap:8px;padding:8px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#send input{flex:1}
#send button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer}
#dbg{position:fixed;left:0;right:0;bottom:0;height:210px;z-index:50;display:flex;flex-direction:column;background:#0d1017;border-top:2px solid var(--accent);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#dbg[hidden]{display:none}
#dbg.min{height:30px}
#dbg .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;color:var(--dim);flex:none}
#dbg .bar button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0 6px;font:inherit}
#dbgLog{flex:1;overflow-y:auto;padding:0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
#dbg.min #dbgLog,#dbg.min #dbgForm{display:none}
#dbgLog .ok{color:#7fd6a0}#dbgLog .warn{color:#f0c35e}#dbgLog .err{color:var(--err)}#dbgLog .cmd{color:var(--accent)}#dbgLog .info{color:#b9bfd3}
#dbgForm{display:flex;gap:6px;align-items:center;padding:4px 10px;border-top:1px solid var(--line);flex:none;color:var(--accent)}
#dbgForm input{background:none;border:0;padding:2px 0;border-radius:0;font:inherit}
body.dbg{padding-bottom:210px}
body.dbg.dbgmin{padding-bottom:30px}
header{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
header #who{color:var(--dim);font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
aside .sect{margin-top:16px;color:var(--dim);font-size:13px}
.peer{display:flex;align-items:center;gap:8px;padding:3px 4px;min-width:0}
.peer .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#7fd6a0}
.peer.away .dot{background:var(--dim)}
.peer.writing .dot{background:var(--accent)}
.peer .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peer .stat{margin-left:auto;font-size:12px;color:var(--dim);flex:none}
.peer.writing .stat{color:var(--accent)}
.typing{min-height:22px;padding:0 18px 4px;color:var(--dim);font-size:13px}
header{align-items:center}
header #who{flex:1;text-align:right}
header button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer;flex:none}
#pinPanel{position:absolute;top:50px;right:12px;width:min(420px,calc(100% - 24px));max-height:55%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:5;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#pinPanel[hidden]{display:none}
.pin{padding:8px 10px;border-radius:6px;cursor:pointer}
.pin:hover{background:#2d3449}
.pin .phead{font-size:12px;color:var(--dim)}
.pin .ptxt{overflow-wrap:anywhere}
.pin button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12px;margin-top:2px}
.pinempty{color:var(--dim);padding:10px}
.msg{position:relative}
.msg.pinned{border-left:2px solid var(--accent);padding-left:8px;margin-left:-10px}
.acts{position:absolute;right:0;top:-2px;display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px}
.msg:hover .acts,.msg:focus-within .acts{display:flex}
.acts button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:12px;padding:2px 8px}
.acts button:hover{color:var(--text)}
@media (hover:none){.acts{display:flex;position:static;background:none;border:0;padding:0;margin-top:2px}}
.quote{border-left:3px solid var(--line);padding:1px 8px;margin:4px 0 2px;color:var(--dim);font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote b{color:var(--text);margin-right:6px}
.pic{max-width:min(100%,360px);max-height:320px;border-radius:8px;margin-top:4px;cursor:zoom-in;display:block}
.imgph{min-height:120px;width:200px;display:grid;place-items:center;background:var(--panel);border-radius:8px;color:var(--dim);margin-top:4px;font-size:13px}
@keyframes fl{from{background:rgba(240,163,94,.3)}to{background:transparent}}
.msg.flash{animation:fl 1.6s}
.bar2{display:flex;align-items:center;gap:10px;padding:6px 18px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}
.bar2[hidden]{display:none}
.bar2 img{height:40px;border-radius:4px}
.bar2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar2 button{margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer;flex:none}
#send #attach{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:0 12px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:100;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:95vw;max-height:95vh}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:60;max-width:90vw}
#toast[hidden]{display:none}
@media (max-width:640px){#app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Hector Chat</h1>
    <p id="gateHint">Enter the password to come in.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <input id="nm" placeholder="Your name" maxlength="24" hidden>
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="goBtn">Continue</button>
  </form>
</div>

<div id="app">
  <aside>
    <div class="srv">Hector Chat</div>
    <div class="ch"># general</div>
    <div class="sect" id="connHead">Connected</div>
    <div id="conn"></div>
    <div class="me">Signed in as <b id="meName"></b><br><button id="leave">Leave</button></div>
  </aside>
  <main>
    <header><span># general</span><span id="who"></span><button id="pinBtn" type="button">Pins (0)</button></header>
    <div id="pinPanel" hidden></div>
    <div id="log" aria-live="polite"></div>
    <div class="typing" id="typing" aria-live="polite"></div>
    <div class="bar2" id="replybar" hidden><span id="replyTxt"></span><button type="button" id="cancelReply">cancel</button></div>
    <div class="bar2" id="stage" hidden><img id="stageImg" alt=""><span>Image ready. Add a caption if you like, then send.</span><button type="button" id="unstage">remove</button></div>
    <form id="send" autocomplete="off">
      <button type="button" id="attach" aria-label="Attach image">Image</button>
      <input type="file" id="file" accept="image/*" hidden>
      <input id="txt" placeholder="Message #general" maxlength="1500">
      <button>Send</button>
    </form>
  </main>
</div>

<div id="lb" hidden><img alt="full size"></div>
<div id="toast" hidden></div>

<div id="dbg" hidden>
  <div class="bar"><span>debug terminal (type help)</span><button id="dbgMin" type="button">minimise</button></div>
  <div id="dbgLog"></div>
  <form id="dbgForm" autocomplete="off"><span>&gt;</span><input id="dbgIn" aria-label="Debug command" spellcheck="false" autocapitalize="off"></form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============ Firebase config (Hector Chat) ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA3TRUmpS0ppdpx3Z9qHRK4LjZAx1YMoBo",
  authDomain: "hectorchat-16d80.firebaseapp.com",
  databaseURL: "https://hectorchat-16d80-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hectorchat-16d80",
  storageBucket: "hectorchat-16d80.firebasestorage.app",
  messagingSenderId: "381910838290",
  appId: "1:381910838290:web:52b00d187b9ec6736bfccb"
};
/* ============================================================ */

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const SETUP = location.hash === "#setup";   // open yourpage/#setup once to create the room

let roomRef, aesKey, myName = "", roomId8 = "";

/* ---- debug terminal: open yourpage/#debug ---- */
const DEBUG = location.hash === "#debug";
const t0 = Date.now();
let rx = 0, rxFail = 0, tx = 0, online = null;
function dlog(msg, lvl = "info"){
  if(!DEBUG) return;
  const line = document.createElement("div");
  line.className = lvl;
  line.textContent = "[" + ((Date.now() - t0) / 1000).toFixed(2).padStart(6) + "] " + msg;
  const el = $("dbgLog"); el.append(line); el.scrollTop = el.scrollHeight;
}
if(DEBUG){
  $("dbg").hidden = false; document.body.classList.add("dbg");
  $("dbgMin").onclick = () => {
    const m = $("dbg").classList.toggle("min");
    document.body.classList.toggle("dbgmin", m);
    $("dbgMin").textContent = m ? "expand" : "minimise";
  };
  window.addEventListener("error", e => dlog("JS error: " + e.message, "err"));
  window.addEventListener("unhandledrejection", e => dlog("Unhandled: " + (e.reason && e.reason.message || e.reason), "err"));
  const ce = console.error; console.error = (...a) => { dlog("console.error: " + a.map(x => x && x.message || String(x)).join(" "), "err"); ce.apply(console, a); };
  dlog("debug on. Passwords and keys are never printed here.", "ok");
  dlog("page: " + location.origin + location.pathname);
  dlog("webcrypto: " + (window.crypto && crypto.subtle ? "available" : "MISSING (needs https)"), crypto && crypto.subtle ? "ok" : "err");
  dlog("firebase sdk " + firebase.SDK_VERSION + ", project " + FIREBASE_CONFIG.projectId);
  db.ref(".info/connected").on("value", s => {
    online = !!s.val();
    dlog("database " + (online ? "connected" : "disconnected / connecting..."), online ? "ok" : "warn");
  });
  const cmds = {
    help(){ return "commands: help, status, test, clear"; },
    clear(){ $("dbgLog").innerHTML = ""; return null; },
    status(){
      return [
        "database: " + (online === null ? "unknown" : online ? "connected" : "offline"),
        "unlocked: " + (aesKey ? "yes (room " + roomId8 + "...)" : "no"),
        "name: " + (myName || "-"),
        "messages received: " + rx + " (undecryptable: " + rxFail + "), sent: " + tx,
        "setup mode: " + SETUP,
        "connected peers: " + Object.keys(peers).length + ", typing now: " + Object.keys(typers).filter(isTyping).length
      ].join("\n");
    },
    async test(){
      if(!roomRef) return "unlock first: enter the password, then run test.";
      const a = performance.now();
      const snap = await roomRef.child("ok").get();
      return "room check: " + (snap.exists() ? "found" : "NOT found") + " in " + Math.round(performance.now() - a) + " ms";
    }
  };
  $("dbgForm").addEventListener("submit", async e => {
    e.preventDefault();
    const c = $("dbgIn").value.trim().toLowerCase(); $("dbgIn").value = ""; if(!c) return;
    dlog("> " + c, "cmd");
    if(!cmds[c]){ dlog("unknown command. try: help", "warn"); return; }
    try{ const out = await cmds[c](); if(out) dlog(out); }catch(ex){ dlog("command failed: " + ex.message, "err"); }
  });
}

/* ---- crypto: one password -> room id + AES key (neither reveals the password) ---- */
const b64 = {
  to: u8 => btoa(String.fromCharCode(...u8)),
  from: s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
};
async function derive(password){
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2", hash:"SHA-256", iterations:250000, salt:enc.encode("back-room-v1")}, base, 512));
  const roomId = [...bits.slice(32)].map(b => b.toString(16).padStart(2,"0")).join("");
  const key = await crypto.subtle.importKey("raw", bits.slice(0,32), "AES-GCM", false, ["encrypt","decrypt"]);
  return {roomId, key};
}
async function seal(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, aesKey, enc.encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct,12);
  return b64.to(all);
}
async function open(str){
  const all = b64.from(str);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: all.slice(0,12)}, aesKey, all.slice(12));
  return JSON.parse(dec.decode(pt));
}

/* ---- gate ---- */
$("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = ""; $("goBtn").disabled = true;
  dlog(aesKey ? "name submitted" : "password submitted, deriving key (250k rounds)...");
  try{
    if(!aesKey){
      const tk = performance.now();
      const {roomId, key} = await derive($("pw").value);
      roomId8 = roomId.slice(0, 8);
      dlog("key derived in " + Math.round(performance.now() - tk) + " ms; room id starts " + roomId8, "ok");
      roomRef = db.ref("rooms/" + roomId);
      dlog("checking rooms/" + roomId8 + "…/ok");
      const ok = await roomRef.child("ok").get();
      dlog("room marker " + (ok.exists() ? "found" : "not found"), ok.exists() ? "ok" : "warn");
      if(!ok.exists()){
        if(SETUP){ dlog("setup mode: creating room", "warn"); await roomRef.child("ok").set(true); dlog("room created", "ok"); }
        else { dlog("wrong password (no room with this key)", "err"); $("err").textContent = "Wrong password."; return; }
      }
      aesKey = key; dlog("unlocked. waiting for name", "ok");
      $("pw").required = false; $("pw").hidden = true; $("pw").value = "";
      $("nm").hidden = false; $("nm").required = true;
      $("nm").value = localStorage.getItem("br_name") || "";
      $("gateHint").textContent = "What should everyone call you?";
      $("nm").focus();
    } else {
      myName = $("nm").value.trim();
      if(!myName) return;
      try{ localStorage.setItem("br_name", myName); }catch(x){ dlog("couldn't save name locally: " + x.message, "warn"); }
      dlog("entering room as " + myName.length + "-char name", "ok");
      enterRoom();
    }
  }catch(ex){ dlog("FAILED: " + (ex.code || "") + " " + ex.message, "err"); $("err").textContent = "Couldn't connect. Check the Firebase config."; console.error(ex); }
  finally{ $("goBtn").disabled = false; }
});

/* ---- chat ---- */
const hue = s => { let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
let lastWho = null, lastTime = 0;

function enterRoom(){
  $("gate").style.display = "none";
  $("app").classList.add("on");
  $("meName").textContent = myName;
  $("log").innerHTML = '<div class="empty" id="empty">No messages yet. Say hi.</div>';
  dlog("subscribing to messages (last 300)");
  let q = Promise.resolve();
  roomRef.child("messages").limitToLast(300).on("child_added", snap => { q = q.then(() => onMsg(snap)); });
  async function onMsg(snap){
    const v = snap.val();
    let m;
    try{ m = await open(v.d); }catch{ rxFail++; dlog("message " + snap.key.slice(-6) + " could not be decrypted (ignored)", "warn"); return; }   // ignore anything that isn't ours
    rx++;
    if(document.hidden && v.t > loadedAt && m.n !== myName){ unread++; document.title = "(" + unread + ") Hector Chat"; }
    dlog("received message " + snap.key.slice(-6) + " (" + (v.d.length) + " bytes encrypted)");
    render(snap.key, m, v.t);
  }
  $("txt").focus();
  startPresence();
  startPins();
}

const msgs = new Map(), els = new Map(), imgCache = new Map();
let pins = {}, sVer = 0, replyTo = null, staged = null, sending = false, toastT;
const SAFE_IMG = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
const snip = m => { const t = (m.m || "").replace(/\s+/g, " ").trim(); return (t || (m.i ? "[image]" : "")).slice(0, 90); };

function toast(t){
  const el = $("toast"); el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2800);
}
const mk = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };

function render(key, m, t){
  const name = m.n, log = $("log");
  msgs.set(key, {m, t});
  const empty = $("empty"); if(empty) empty.remove();
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const wrap = mk("div", "msg"); wrap.dataset.k = key;
  if(pins[key]) wrap.classList.add("pinned");
  if(name !== lastWho || t - lastTime > 5*60*1000){
    const meta = mk("div", "meta");
    const w = mk("span", "who", name); w.style.color = `hsl(${hue(name)} 70% 72%)`;
    const d = mk("span", "when", new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}));
    meta.append(w, d); wrap.append(meta);
  }
  if(m.r){
    const qt = mk("div", "quote"); qt.append(mk("b", null, m.r.n || "?"), document.createTextNode(m.r.m || ""));
    qt.onclick = () => jumpTo(m.r.k); wrap.append(qt);
  }
  if(m.m) wrap.append(mk("div", "body", m.m));
  if(m.i){ const ph = mk("div", "imgph", "image"); ph.dataset.i = m.i; imgObserver.observe(ph); wrap.append(ph); }
  const acts = mk("div", "acts");
  const rb = mk("button", null, "Reply"); rb.type = "button"; rb.onclick = () => setReply(key);
  const pb = mk("button", "pinact", pins[key] ? "Unpin" : "Pin"); pb.type = "button"; pb.onclick = () => togglePin(key);
  acts.append(rb, pb); wrap.append(acts);
  log.append(wrap); els.set(key, wrap);
  lastWho = name; lastTime = t;
  if(nearBottom || name === myName) log.scrollTop = log.scrollHeight;
}

/* ---- images: compressed in the browser, stored encrypted, loaded when scrolled into view ---- */
const imgObserver = new IntersectionObserver(list => {
  for(const e of list){ if(e.isIntersecting){ imgObserver.unobserve(e.target); loadImage(e.target); } }
}, {rootMargin: "300px"});

async function loadImage(ph){
  const id = ph.dataset.i; ph.textContent = "loading image…";
  try{
    let url = imgCache.get(id);
    if(!url){
      const snap = await roomRef.child("images/" + id).get();
      if(!snap.exists()) throw new Error("not found");
      url = (await open(snap.val().d)).u; imgCache.set(id, url);
    }
    if(!SAFE_IMG.test(url)) throw new Error("not a valid image");
    const log = $("log"), stick = log.scrollHeight - log.scrollTop - log.clientHeight < 250;
    const img = mk("img", "pic"); img.alt = "uploaded image"; img.src = url;
    img.onclick = () => { $("lb").firstElementChild.src = url; $("lb").hidden = false; };
    img.onload = () => { if(stick) log.scrollTop = log.scrollHeight; };
    ph.replaceWith(img);
  }catch(ex){ ph.textContent = "image unavailable"; dlog("image " + id.slice(-6) + " failed: " + ex.message, "err"); }
}
$("lb").onclick = () => { $("lb").hidden = true; };

async function prepImage(file){
  if(!file.type.startsWith("image/")) throw new Error("not an image");
  const bmp = await createImageBitmap(file);
  let scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  for(let i = 0; i < 6; i++){
    const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h);
    for(const qlt of [0.82, 0.68, 0.52]){
      const url = c.toDataURL("image/jpeg", qlt);
      if(url.length < 240000){ bmp.close && bmp.close(); return url; }
    }
    scale *= 0.75;
  }
  throw new Error("image too large even after shrinking");
}
async function stageFile(file){
  try{
    dlog("preparing image: " + file.type + ", " + Math.round(file.size / 1024) + " KB");
    staged = await prepImage(file);
    $("stageImg").src = staged; $("stage").hidden = false;
    dlog("image ready: " + Math.round(staged.length / 1024) + " KB after compression", "ok");
  }catch(ex){ staged = null; toast("Couldn't use that image."); dlog("image prep failed: " + ex.message, "err"); }
}
function unstage(){ staged = null; $("stage").hidden = true; $("stageImg").removeAttribute("src"); $("file").value = ""; }
$("attach").onclick = () => $("file").click();
$("file").onchange = () => { const f = $("file").files[0]; if(f) stageFile(f); };
$("unstage").onclick = unstage;
$("txt").addEventListener("paste", e => {
  const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith("image/"));
  if(it){ e.preventDefault(); stageFile(it.getAsFile()); }
});

/* ---- replies ---- */
function setReply(k){
  const o = msgs.get(k); if(!o) return;
  replyTo = {k, n: o.m.n, m: snip(o.m)};
  $("replyTxt").textContent = "Replying to " + o.m.n + ": " + replyTo.m;
  $("replybar").hidden = false; $("txt").focus();
}
function clearReply(){ replyTo = null; $("replybar").hidden = true; }
$("cancelReply").onclick = clearReply;

function jumpTo(k){
  const el = els.get(k);
  if(!el){ toast("That message is older than the 300 most recent."); return; }
  el.scrollIntoView({block: "center", behavior: "smooth"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ---- pins (shared by everyone in the room) ---- */
function startPins(){
  roomRef.child("pins").on("value", async snap => {
    const v = ++sVer, out = await readAll(snap);
    if(v !== sVer) return;
    pins = out; renderPins(); dlog("pins: " + Object.keys(pins).length);
  });
}
async function togglePin(k){
  try{
    if(pins[k]){ await roomRef.child("pins/" + k).remove(); return; }
    const o = msgs.get(k); if(!o) return;
    await roomRef.child("pins/" + k).set({d: await seal({n: o.m.n, m: snip(o.m), by: myName}), t: firebase.database.ServerValue.TIMESTAMP});
  }catch(ex){ toast("Couldn't change pin."); dlog("pin failed: " + (ex.code || "") + " " + ex.message + " (publish the updated rules)", "err"); }
}
function renderPins(){
  const ks = Object.keys(pins).sort((a, b) => (pins[b].t || 0) - (pins[a].t || 0));
  $("pinBtn").textContent = "Pins (" + ks.length + ")";
  for(const [k, el] of els){
    const on = !!pins[k]; el.classList.toggle("pinned", on);
    const b = el.querySelector(".pinact"); if(b) b.textContent = on ? "Unpin" : "Pin";
  }
  const box = $("pinPanel"); box.textContent = "";
  if(!ks.length){ box.append(mk("div", "pinempty", "Nothing pinned yet. Use Pin on any message.")); return; }
  for(const k of ks){
    const p = pins[k], row = mk("div", "pin");
    row.append(mk("div", "phead", p.n + " · pinned by " + p.by), mk("div", "ptxt", p.m));
    const ub = mk("button", null, "Unpin"); ub.type = "button"; ub.onclick = e => { e.stopPropagation(); togglePin(k); };
    row.append(ub);
    row.onclick = () => { box.hidden = true; jumpTo(k); };
    box.append(row);
  }
}
$("pinBtn").onclick = () => { $("pinPanel").hidden = !$("pinPanel").hidden; };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ $("lb").hidden = true; $("pinPanel").hidden = true; } });

$("send").addEventListener("submit", async e => {
  e.preventDefault();
  if(sending) return;
  const text = $("txt").value.trim();
  if(!text && !staged) return;
  sending = true;
  const rt = replyTo, st = staged, TS = firebase.database.ServerValue.TIMESTAMP;
  $("txt").value = ""; clearReply(); unstage();
  try{
    const payload = {n: myName, m: text};
    if(rt) payload.r = rt;
    if(st){
      dlog("uploading image (" + Math.round(st.length / 1024) + " KB, encrypting)...");
      const iref = roomRef.child("images").push();
      await iref.set({d: await seal({u: st}), t: TS});
      payload.i = iref.key; dlog("image stored", "ok");
    }
    dlog("sending " + text.length + " chars" + (rt ? " as a reply" : "") + "...");
    await roomRef.child("messages").push({d: await seal(payload), t: TS});
    tx++; dlog("send confirmed by server", "ok");
  }catch(ex){
    dlog("SEND FAILED: " + (ex.code || "") + " " + ex.message + " (check database rules)", "err");
    toast("Message failed to send."); if(text) $("txt").value = text;
  }finally{ sending = false; }
});

/* ---- presence + typing ---- */
const cid = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, "0")).join("");
let srvOffset = 0, peers = {}, typers = {}, loadedAt = 0, unread = 0, pVer = 0, tVer = 0;
let typingTimer = null, lastTypingSent = 0, pRef = null, tRef = null;
const FRESH = 7000;
db.ref(".info/serverTimeOffset").on("value", s => { srvOffset = s.val() || 0; });
const srvNow = () => Date.now() + srvOffset;
const isTyping = k => typers[k] && srvNow() - typers[k].t < FRESH;

async function announce(){
  if(!pRef) return;
  try{
    await pRef.set({d: await seal({n: myName, s: document.hidden ? "away" : "here"}), t: firebase.database.ServerValue.TIMESTAMP});
  }catch(ex){ dlog("presence write failed: " + (ex.code || "") + " " + ex.message + " (publish the updated database rules)", "err"); }
}

async function readAll(snap){
  const out = {};
  for(const [k, e] of Object.entries(snap.val() || {})){
    try{ out[k] = Object.assign(await open(e.d), {t: e.t}); }catch{}
  }
  return out;
}

function startPresence(){
  loadedAt = srvNow();
  pRef = roomRef.child("presence/" + cid);
  tRef = roomRef.child("typing/" + cid);
  db.ref(".info/connected").on("value", s => {
    if(!s.val()) return;
    pRef.onDisconnect().remove(); tRef.onDisconnect().remove();
    announce(); dlog("presence announced", "ok");
  });
  document.addEventListener("visibilitychange", () => {
    announce();
    if(!document.hidden){ unread = 0; document.title = "Hector Chat"; }
  });
  roomRef.child("presence").on("value", async snap => {
    const v = ++pVer, out = await readAll(snap);
    if(v !== pVer) return;
    peers = out; renderPeers(); dlog("presence update: " + Object.keys(peers).length + " connected");
  });
  roomRef.child("typing").on("value", async snap => {
    const v = ++tVer, out = await readAll(snap);
    if(v !== tVer) return;
    typers = out; renderTyping(); renderPeers();
  });
  setInterval(() => { renderTyping(); renderPeers(); }, 2000);
}

function renderPeers(){
  const ks = Object.keys(peers).sort((a, b) => (peers[a].n || "").localeCompare(peers[b].n || ""));
  $("connHead").textContent = "Connected (" + ks.length + ")";
  const box = $("conn"); box.textContent = "";
  for(const k of ks){
    const p = peers[k];
    const st = isTyping(k) ? "writing" : p.s === "away" ? "away" : "reading";
    const row = document.createElement("div"); row.className = "peer " + st;
    const dot = document.createElement("span"); dot.className = "dot";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.n + (k === cid ? " (you)" : "");
    const stt = document.createElement("span"); stt.className = "stat"; stt.textContent = st;
    row.append(dot, nm, stt); box.append(row);
  }
  $("who").textContent = ks.length ? ks.length + " connected: " + ks.map(k => peers[k].n).join(", ") : "";
}

function renderTyping(){
  const names = [...new Set(Object.keys(typers).filter(k => k !== cid && isTyping(k)).map(k => typers[k].n))];
  let t = "";
  if(names.length === 1) t = names[0] + " is typing…";
  else if(names.length === 2) t = names[0] + " and " + names[1] + " are typing…";
  else if(names.length === 3) t = names[0] + ", " + names[1] + " and " + names[2] + " are typing…";
  else if(names.length > 3) t = "Several people are typing…";
  $("typing").textContent = t;
}

function stopTyping(){
  clearTimeout(typingTimer); lastTypingSent = 0;
  if(tRef) tRef.remove().catch(() => {});
}
$("txt").addEventListener("input", () => {
  if(!tRef) return;
  if(!$("txt").value.trim()){ stopTyping(); return; }
  clearTimeout(typingTimer); typingTimer = setTimeout(stopTyping, 4000);
  if(srvNow() - lastTypingSent > 2500){
    lastTypingSent = srvNow();
    seal({n: myName}).then(d => tRef.set({d, t: firebase.database.ServerValue.TIMESTAMP}))
      .catch(ex => dlog("typing write failed: " + (ex.code || "") + " " + ex.message, "err"));
  }
});
$("send").addEventListener("submit", stopTyping);

$("leave").onclick = async () => {
  try{ await Promise.race([Promise.all([pRef && pRef.remove(), tRef && tRef.remove()]), new Promise(r => setTimeout(r, 1500))]); }catch{}
  location.reload();
};
</script>
