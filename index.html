<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hector Chat</title>
<style>
:root{--bg:#1b1f2b;--panel:#232838;--line:#32384c;--text:#e6e8ef;--dim:#8d93a8;--accent:#f0a35e;--accent-ink:#2a1a08;--err:#ff8585}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate form{width:100%;max-width:340px;display:grid;gap:12px}
.gate h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.gate p{margin:0 0 8px;color:var(--dim)}
input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
button.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:var(--err);min-height:1.4em;margin:0}
#app{display:none;height:100%;grid-template-columns:220px 1fr}
#app.on{display:grid}
aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px}
aside .srv{font-weight:700;font-size:17px;margin-bottom:10px}
aside .ch{background:#2d3449;border-radius:6px;padding:6px 10px}
aside .me{margin-top:auto;color:var(--dim);font-size:13px}
aside .me button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
#log{flex:1;overflow-y:auto;padding:14px 18px}
.msg{padding:2px 0}
.msg .meta{display:flex;gap:8px;align-items:baseline;margin-top:12px}
.msg .who{font-weight:600}
.msg .when{color:var(--dim);font-size:12px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--dim);text-align:center;margin-top:40px}
#send{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#send input{flex:1}
#send button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer}
@media (max-width:640px){#app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Hector Chat</h1>
    <p id="gateHint">Enter the password to come in.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <input id="nm" placeholder="Your name" maxlength="24" hidden>
    <p class="err" id="err" role="alert"></p>
    <button class="go" id="goBtn">Continue</button>
  </form>
</div>

<div id="app">
  <aside>
    <div class="srv">Hector Chat</div>
    <div class="ch"># general</div>
    <div class="me">Signed in as <b id="meName"></b><br><button id="leave">Leave</button></div>
  </aside>
  <main>
    <header># general</header>
    <div id="log" aria-live="polite"></div>
    <form id="send" autocomplete="off">
      <input id="txt" placeholder="Message #general" maxlength="1500" required>
      <button>Send</button>
    </form>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============ Firebase config (Hector Chat) ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA3TRUmpS0ppdpx3Z9qHRK4LjZAx1YMoBo",
  authDomain: "hectorchat-16d80.firebaseapp.com",
  databaseURL: "https://hectorchat-16d80-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hectorchat-16d80",
  storageBucket: "hectorchat-16d80.firebasestorage.app",
  messagingSenderId: "381910838290",
  appId: "1:381910838290:web:52b00d187b9ec6736bfccb"
};
/* ============================================================ */

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const SETUP = location.hash === "#setup";   // open yourpage/#setup once to create the room

let roomRef, aesKey, myName = "";

/* ---- crypto: one password -> room id + AES key (neither reveals the password) ---- */
const b64 = {
  to: u8 => btoa(String.fromCharCode(...u8)),
  from: s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
};
async function derive(password){
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    {name:"PBKDF2", hash:"SHA-256", iterations:250000, salt:enc.encode("back-room-v1")}, base, 512));
  const roomId = [...bits.slice(32)].map(b => b.toString(16).padStart(2,"0")).join("");
  const key = await crypto.subtle.importKey("raw", bits.slice(0,32), "AES-GCM", false, ["encrypt","decrypt"]);
  return {roomId, key};
}
async function seal(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, aesKey, enc.encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct,12);
  return b64.to(all);
}
async function open(str){
  const all = b64.from(str);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: all.slice(0,12)}, aesKey, all.slice(12));
  return JSON.parse(dec.decode(pt));
}

/* ---- gate ---- */
$("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = ""; $("goBtn").disabled = true;
  try{
    if(!aesKey){
      const {roomId, key} = await derive($("pw").value);
      roomRef = db.ref("rooms/" + roomId);
      const ok = await roomRef.child("ok").get();
      if(!ok.exists()){
        if(SETUP){ await roomRef.child("ok").set(true); }
        else { $("err").textContent = "Wrong password."; return; }
      }
      aesKey = key;
      $("pw").hidden = true; $("pw").value = "";
      $("nm").hidden = false; $("nm").required = true;
      $("nm").value = localStorage.getItem("br_name") || "";
      $("gateHint").textContent = "What should everyone call you?";
      $("nm").focus();
    } else {
      myName = $("nm").value.trim();
      if(!myName) return;
      localStorage.setItem("br_name", myName);
      enterRoom();
    }
  }catch(ex){ $("err").textContent = "Couldn't connect. Check the Firebase config."; console.error(ex); }
  finally{ $("goBtn").disabled = false; }
});

/* ---- chat ---- */
const hue = s => { let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
let lastWho = null, lastTime = 0;

function enterRoom(){
  $("gate").style.display = "none";
  $("app").classList.add("on");
  $("meName").textContent = myName;
  $("log").innerHTML = '<div class="empty" id="empty">No messages yet. Say hi.</div>';
  roomRef.child("messages").limitToLast(300).on("child_added", async snap => {
    const v = snap.val();
    let m;
    try{ m = await open(v.d); }catch{ return; }   // ignore anything that isn't ours
    render(m.n, m.m, v.t);
  });
  $("txt").focus();
}

function render(name, text, t){
  const log = $("log");
  const empty = $("empty"); if(empty) empty.remove();
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const wrap = document.createElement("div"); wrap.className = "msg";
  if(name !== lastWho || t - lastTime > 5*60*1000){
    const meta = document.createElement("div"); meta.className = "meta";
    const w = document.createElement("span"); w.className = "who"; w.textContent = name;
    w.style.color = `hsl(${hue(name)} 70% 72%)`;
    const d = document.createElement("span"); d.className = "when";
    d.textContent = new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
    meta.append(w, d); wrap.append(meta);
  }
  const body = document.createElement("div"); body.className = "body"; body.textContent = text;
  wrap.append(body); log.append(wrap);
  lastWho = name; lastTime = t;
  if(nearBottom || name === myName) log.scrollTop = log.scrollHeight;
}

$("send").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("txt").value.trim(); if(!text) return;
  $("txt").value = "";
  roomRef.child("messages").push({
    d: await seal({n: myName, m: text}),
    t: firebase.database.ServerValue.TIMESTAMP
  });
});

$("leave").onclick = () => location.reload();
</script>
</body>
</html>
